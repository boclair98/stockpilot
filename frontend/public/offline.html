<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#11151c" />
    <title>오프라인 | StockPilot</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;color:#191f28;background:#f6f7f9}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.card{width:min(440px,100%);padding:32px 26px;border:1px solid #e5e9ed;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(25,31,40,.1);text-align:center}.mark{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border-radius:21px;color:#fff;background:linear-gradient(145deg,#171b21,#333b46);font-size:28px}.eyebrow{margin:0 0 8px;color:#d8273f;font-size:11px;font-weight:900;letter-spacing:1px}.card h1{margin:0;font-size:25px;letter-spacing:-.8px;word-break:keep-all}.card p{margin:13px 0 24px;color:#6b7683;font-size:13px;line-height:1.7;word-break:keep-all}.card button{width:100%;min-height:48px;border:0;border-radius:15px;color:#fff;background:#191f28;font-size:13px;font-weight:850;cursor:pointer}.card small{display:block;margin-top:15px;color:#9aa3ad;font-size:10px;line-height:1.5}@media(prefers-reduced-motion:no-preference){.mark{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{transform:translateY(-3px);box-shadow:0 12px 28px rgba(25,31,40,.2)}}}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">↗</div>
      <p class="eyebrow">STOCKPILOT OFFLINE</p>
      <h1>지금은 시장에 연결할 수 없어요</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요. 주문과 자산 데이터는 연결이 복구될 때까지 변경되지 않습니다.</p>
      <button type="button" onclick="location.reload()">연결 다시 확인</button>
      <small>실제 주문을 다루지 않는 투자 학습·가상투자 서비스입니다.</small>
    </main>
  </body>
</html>
